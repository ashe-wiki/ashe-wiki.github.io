<!doctype html><html lang=en><head><meta charset=UTF-8><meta content="width=device-width,initial-scale=1.0" name=viewport><title>Pomodoro Timer</title><link href=https://ashe-wiki.github.io/25/favicon.svg rel=icon type=image/svg+xml><link href=https://fonts.googleapis.com rel=preconnect><link crossorigin href=https://fonts.gstatic.com rel=preconnect><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Great+Vibes&display=swap" rel=stylesheet><link href=https://ashe-wiki.github.io/25/css/style.css rel=stylesheet><body><div class=quote-top>Don't count the days, make the days count.</div><a class=days-left-link href=https://github.com/ashe-c0de target=_blank> <div class=days-left id=days-left></div> </a><main class=timer><div class=timer__frame><svg viewbox="0 0 660 620" class=timer__border fill=none><path d="M 35,18 L 160,35 L 330,12 L 500,32 L 625,15 L 645,155 L 625,315 L 648,475 L 630,602 L 500,615 L 330,592 L 160,618 L 25,600 L 12,475 L 38,315 L 10,155 Z" fill=none opacity=0.5 stroke=#edc3ae stroke-width=1.5 /></svg><div class=timer__face><svg viewbox="0 0 200 200" class=timer__progress><circle class=timer__track cx=100 cy=100 r=90 /><circle class=timer__ring cx=100 cy=100 id=progress r=90 /></svg><div class=timer__info><div class=timer__label>FOCUS</div><div class=timer__time id=time>25:00</div></div><button class=timer__option data-minutes=5>5m</button><button class="timer__option timer__option--active" data-minutes=25>25m</button><button class=timer__option data-minutes=60>60m</button></div><button class=timer__button id=skip>Skip</button></div></main><script src=https://ashe-wiki.github.io/25/js/app.js></script>
